[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mobi2epub"
version = "0.1.0"
description = "Fast, robust batch .mobi to .epub converter CLI"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "mobi>=0.4.1",
    "tqdm>=4.66.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
mobi2epub = "mobi2epub.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mobi2epub*"]
